name: Sync npm lockfile
on:
  push:
    branches: [main]
    paths:
      - package.json
permissions:
  contents: write
concurrency:
  group: peopleos-lockfile-main
  cancel-in-progress: true
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate deterministic dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate locked dependency tree
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run lint
          npm test
          npm run build
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
          else
            git commit -m "chore: sync npm lockfile [lockfile-sync]"
            git push origin main
          fi
