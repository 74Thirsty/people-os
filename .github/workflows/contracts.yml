name: HRS smart contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: peopleos-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vyper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - name: Install pinned contract toolchain
        run: python -m pip install --requirement contracts/requirements.txt
      - name: Compile HRS token
        run: vyper contracts/src/HrsToken.vy
      - name: Compile HRS operation controller
        run: vyper contracts/src/HrsController.vy
      - name: Execute EVM contract tests
        run: python -m pytest contracts/tests -q
